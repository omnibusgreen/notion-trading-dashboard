<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Npay 증권 마켓 전광판 (최종)</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #ffffff;
      overflow: hidden; /* 노션 임베드 자체의 바깥 스크롤바 방지 */
    }

    /* 네이버 마켓 페이지를 품고 있는 상자 */
    .scroll-container {
      width: 100%;
      height: 100%;
      overflow: auto; /* 내부 상하좌우 스크롤바 허용 */
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    iframe {
      width: 100%;
      /* 마켓 메인 페이지의 긴 컨텐츠를 다 불러오기 위해 높이 확보 */
      height: 2200px; 
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="scroll-container" id="scrollBox">
    <iframe src="https://stock.naver.com/market/marketindex/major"></iframe>
  </div>

  <script>
    // 페이지가 로드되면 상단 네이버 로고와 메뉴 검색창 레이어(약 165px)를 
    // 자동으로 지나쳐서 마스터트레이더용님이 원하신 '주요/환율' 몸통 위치로 스크롤을 딱 내려줍니다.
    window.addEventListener('load', () => {
      setTimeout(() => {
        const scrollBox = document.getElementById('scrollBox');
        if (scrollBox) {
          scrollBox.scrollTop = 165; // 딱 마켓 전광판 몸통 시작점으로 포커싱
        }
      }, 600); // 페이지 로드를 안전하게 기다리기 위한 0.6초 딜레이
    });
  </script>

</body>
</html>
