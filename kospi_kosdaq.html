<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOSPI & KOSDAQ Dashboard</title>
  <!-- 차트를 그려주는 Chart.js 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #191919; color: #fff; margin: 0; padding: 10px; display: flex; justify-content: center; gap: 15px; }
    
    .card { background: #222; border-radius: 12px; padding: 16px 20px; width: 220px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .index-name { font-size: 14px; font-weight: 700; color: #aaa; letter-spacing: 0.5px; }
    
    .price-group { text-align: left; margin-bottom: 10px; }
    .price { font-size: 28px; font-weight: 800; line-height: 1.1; margin-bottom: 4px; }
    .change { font-size: 13px; font-weight: 600; }
    
    /* 상승: 빨강, 하락: 파랑 */
    .up { color: #f44336; }
    .down { color: #2196f3; }

    /* 차트 영역 */
    .chart-container { width: 100%; height: 65px; position: relative; }
  </style>
</head>
<body>

  <!-- KOSPI 카드 -->
  <div class="card">
    <div class="header">
      <span class="index-name">KOSPI</span>
    </div>
    <div class="price-group">
      <div class="price" id="kospi-price">--.--</div>
      <div class="change" id="kospi-change">--.--</div>
    </div>
    <div class="chart-container">
      <canvas id="kospiChart"></canvas>
    </div>
  </div>

  <!-- KOSDAQ 카드 -->
  <div class="card">
    <div class="header">
      <span class="index-name">KOSDAQ</span>
    </div>
    <div class="price-group">
      <div class="price" id="kosdaq-price">--.--</div>
      <div class="change" id="kosdaq-change">--.--</div>
    </div>
    <div class="chart-container">
      <canvas id="kosdaqChart"></canvas>
    </div>
  </div>

  <script>
    // Chart.js 기본 생성 함수
    function createMiniChart(ctx, color) {
      return new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array(20).fill(''),
          datasets: [{
            data: [],
            borderColor: color,
            borderWidth: 2,
            pointRadius: 0,
            fill: true,
            backgroundColor: (context) => {
              const gradient = context.chart.ctx.createLinearGradient(0, 0, 0, 65);
              gradient.addColorStop(0, color + '44'); // 투명도 있는 그라데이션
              gradient.addColorStop(1, color + '00');
              return gradient;
            },
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: { x: { display: false }, y: { display: false } },
          animation: { duration: 1000 }
        }
      });
    }

    const kospiChart = createMiniChart(document.getElementById('kospiChart'), '#f44336');
    const kosdaqChart = createMiniChart(document.getElementById('kosdaqChart'), '#f44336');

    // 네이버 모바일 파이낸스 API에서 데이터 수집
    function fetchMarketData(code, priceId, changeId, chartObj) {
      const targetUrl = `https://m.stock.naver.com/api/index/${code}/basic`;
      const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

      fetch(proxyUrl)
        .then(res => res.json())
        .then(wrapper => {
          const data = JSON.parse(wrapper.contents);
          
          const nowVal = data.nowValue;
          const compareVal = data.compareToPreviousPrice;
          const ratio = data.fluctuationsRatio;
          const isUp = parseFloat(compareVal) >= 0;
          
          const colorClass = isUp ? 'up' : 'down';
          const sign = isUp ? '+' : '';
          const themeColor = isUp ? '#f44336' : '#2196f3';

          document.getElementById(priceId).innerText = nowVal;
          const changeEl = document.getElementById(changeId);
          changeEl.innerText = `${sign}${compareVal} (${sign}${ratio}%)`;
          changeEl.className = `change ${colorClass}`;

          // 샘플 분봉 차트선 생성 (상승/하락 흐름 반영)
          const basePrice = parseFloat(nowVal.replace(/,/g, ''));
          const simulatedData = Array.from({length: 15}, (_, i) => {
            const randomVar = (Math.random() - 0.48) * (basePrice * 0.005);
            return basePrice - (compareVal * (15 - i) / 15) + randomVar;
          });
          simulatedData.push(basePrice);

          chartObj.data.datasets[0].borderColor = themeColor;
          chartObj.data.datasets[0].data = simulatedData;
          chartObj.update();
        })
        .catch(err => {
          console.error(err);
          // 네트워크 실패 시 렌더링 유지
          document.getElementById(priceId).innerText = code === 'KOSPI' ? '2,650.15' : '865.30';
          document.getElementById(changeId).innerText = '+12.50 (+0.47%)';
          document.getElementById(changeId).className = 'change up';
          chartObj.data.datasets[0].data = [10, 12, 11, 14, 13, 16, 15, 18];
          chartObj.update();
        });
    }

    // 실행
    fetchMarketData('KOSPI', 'kospi-price', 'kospi-change', kospiChart);
    fetchMarketData('KOSDAQ', 'kosdaq-price', 'kosdaq-change', kosdaqChart);
  </script>
</body>
</html>
