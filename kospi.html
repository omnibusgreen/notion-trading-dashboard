<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>KOSPI Intraday Chart</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #131722; overflow: hidden; }
    .widget-container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div id="tradingview_kospi" style="height:calc(100% - 32px);width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
      new TradingView.widget({
        "width": "100%",
        "height": "100%",
        "symbol": "AMEX:EWI",         /* KOSPI를 99% 추종하는 MSCI Korea ETF */
        "interval": "5",             /* 분봉 주기: '1', '3', '5', '15', '30' 가능 */
        "timezone": "Asia/Seoul",
        "theme": "dark",
        "style": "1",                /* 1: 봉차트(Candle), 2: 선차트 */
        "locale": "ko",
        "enable_publishing": false,
        "hide_side_toolbar": true,   /* 노션 임베드용이라 툴바는 깔끔하게 숨김 */
        "allow_symbol_change": false,
        "calendar": false,
        "container_id": "tradingview_kospi"
      });
      </script>
    </div>
  </div>
</body>
</html>
