<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOSPI Widget</title>
  <style>
    /* 노션 임베드 시 불필요한 스크롤바와 여백 제거 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f0f0f; /* 대시보드 톤의 어두운 배경색 */
      overflow: hidden;
    }

    .widget-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* 네이버의 흰 배경을 어둡게 반전시키고, 빨간색/파란색 톤을 유지하는 다크 필터 */
      filter: invert(0.91) hue-rotate(180deg);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <iframe 
      src="https://m.stock.naver.com/chart/domestic/index/KOSPI" 
      scrolling="no">
    </iframe>
  </div>

</body>
</html>
