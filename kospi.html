<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>KOSPI 네이버 5분봉</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0f0f0f; overflow: hidden; }
    .widget-container { width: 100%; height: 100%; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* 네이버의 흰색 차트를 어두운 대시보드 톤으로 바꿔주는 마법의 다크 필터 */
      filter: invert(0.9) hue-rotate(180deg);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <iframe 
      src="https://fchart.stock.naver.com/sise.nhn?symbol=KOSPI&timeframe=5&count=120&requestType=0" 
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
