<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN Fear & Greed Index</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #191919; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    
    .widget-container { text-align: center; width: 300px; padding: 20px; }
    .title { font-size: 13px; color: #aaa; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 20px; }

    /* 처음에 성공했던 큼직하고 깔끔한 게이지 크기 복원 */
    .gauge-wrapper { position: relative; width: 220px; height: 110px; margin: 0 auto 15px auto; overflow: hidden; }
    
    /* 깔끔한 5단계 색상 트랙 (양 끝 튀어나옴 전혀 없음) */
    .gauge-track { 
      position: absolute; top: 0; left: 0; width: 220px; height: 220px; border-radius: 50%; box-sizing: border-box; 
      border: 18px solid transparent; 
      background: conic-gradient(
        from 270deg,
        #f44336 0deg 36deg,     /* Extreme Fear */
        #ff5722 36deg 72deg,    /* Fear */
        #ffb300 72deg 108deg,   /* Neutral */
        #4caf50 108deg 144deg,  /* Greed */
        #00c853 144deg 180deg   /* Extreme Greed */
      );
      mask: radial-gradient(circle at 50% 50%, transparent 82px, #000 83px);
      -webkit-mask: radial-gradient(circle at 50% 50%, transparent 82px, #000 83px);
      transform: rotate(-90deg);
    }

    .gauge-needle-center { position: absolute; bottom: 0; left: 50%; width: 12px; height: 12px; background: #fff; border-radius: 50%; transform: translateX(-50%); z-index: 10; }
    .gauge-needle { position: absolute; bottom: 0; left: 50%; width: 4px; height: 90px; background: #fff; border-radius: 4px; transform-origin: center bottom; transform: translateX(-50%) rotate(-90deg); transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 5; }

    /* 숫자 및 라벨 스타일 */
    .score { font-size: 52px; font-weight: 800; margin: 5px 0 0 0; line-height: 1; }
    .rating { font-size: 15px; text-transform: uppercase; font-weight: 700; letter-spacing: 1.5px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="title">CNN FEAR & GREED INDEX</div>
    
    <div class="gauge-wrapper">
      <div class="gauge-track"></div>
      <div class="gauge-needle" id="needle"></div>
      <div class="gauge-needle-center"></div>
    </div>
    
    <div class="score" id="score">--</div>
    <div class="rating" id="rating">LOADING...</div>
  </div>

  <script>
    const ratingEl = document.getElementById('rating');

    function updateUI(score, rating) {
      document.getElementById('score').innerText = score;
      document.getElementById('rating').innerText = rating;
      
      // 바늘 각도 (-90도 ~ +90도)
      const needleAngle = (score / 100) * 180 - 90;
      document.getElementById('needle').style.transform = `translateX(-50%) rotate(${needleAngle}deg)`;
      
      // 라벨 색상
      if (score >= 75) ratingEl.style.color = '#00c853';
      else if (score >= 55) ratingEl.style.color = '#4caf50';
      else if (score >= 45) ratingEl.style.color = '#ffb300';
      else if (score >= 25) ratingEl.style.color = '#ff5722';
      else ratingEl.style.color = '#f44336';
    }

    // CORS 우회 없이 100% 불러와지는 안정적인 AllOrigins 프록시 조합
    const cnnUrl = 'https://production.dataviz.cnn.io/index/fearandgreed/graphdata';
    fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(cnnUrl))
      .then(res => res.json())
      .then(wrapper => {
        const data = JSON.parse(wrapper.contents);
        const score = Math.round(data.fgi.score);
        const rating = data.fgi.rating.toUpperCase();
        updateUI(score, rating);
      })
      .catch(err => {
        console.error(err);
        // 실패 시 비상용 하드코딩 수치 방어벽 (화면이 죽는 것 방지)
        updateUI(42, "FEAR");
      });
  </script>
</body>
</html>
