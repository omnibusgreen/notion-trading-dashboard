<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #191919; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .title { font-size: 13px; color: #aaa; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 5px; }
    .score { font-size: 54px; font-weight: 800; margin: 5px 0; }
    .rating { font-size: 16px; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="title">CNN FEAR & GREED INDEX</div>
  <div class="score" id="score">--</div>
  <div class="rating" id="rating">LOADING...</div>

  <script>
    // CNN 공식 API 주소
    const cnnUrl = 'https://production.dataviz.cnn.io/index/fearandgreed/graphdata';
    // 신뢰도 높은 corsproxy 서비스 사용
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(cnnUrl);

    fetch(proxyUrl)
      .then(res => res.json())
      .then(data => {
        // CNN 공식 실시간 점수 및 상태
        const score = Math.round(data.fgi.score);
        const rating = data.fgi.rating;
        
        document.getElementById('score').innerText = score;
        document.getElementById('rating').innerText = rating;
        
        const ratingEl = document.getElementById('rating');
        
        // CNN 공식 색상 매핑
        if (score >= 75) {
          ratingEl.style.color = '#00c853'; // Extreme Greed
        } else if (score >= 55) {
          ratingEl.style.color = '#4caf50'; // Greed
        } else if (score >= 45) {
          ratingEl.style.color = '#ffb300'; // Neutral
        } else if (score >= 25) {
          ratingEl.style.color = '#ff5722'; // Fear
        } else {
          ratingEl.style.color = '#f44336'; // Extreme Fear
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('rating').innerText = 'ERROR';
      });
  </script>
</body>
</html>
