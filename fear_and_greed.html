<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN Fear & Greed Index</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #191919; color: #fff;
      display: flex; align-items: center; justify-content: center;
      height: 100vh; margin: 0;
    }
    .widget { text-align: center; width: 300px; padding: 20px; }
    .title { font-size: 12px; color: #999; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }

    svg { display: block; margin: 0 auto; overflow: visible; }

    .seg { transition: opacity .6s, stroke-width .6s; opacity: .32; }
    .seg.active { opacity: 1; }

    #needleGroup {
      transform-origin: 110px 110px;
      transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .end-label { font-size: 10px; fill: #777; font-weight: 600; }

    .score { font-size: 50px; font-weight: 800; margin: 6px 0 0; line-height: 1; transition: color .6s; }
    .rating { font-size: 14px; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; margin-top: 8px; transition: color .6s; }
  </style>
</head>
<body>
  <div class="widget">
    <div class="title">CNN Fear &amp; Greed Index</div>

    <svg id="gauge" width="240" height="132" viewBox="0 0 220 122">
      <g id="segments"></g>
      <text class="end-label" x="16" y="122" text-anchor="middle">0</text>
      <text class="end-label" x="204" y="122" text-anchor="middle">100</text>
      <g id="needleGroup" style="transform: rotate(-90deg);">
        <line x1="110" y1="110" x2="110" y2="34" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <circle cx="110" cy="110" r="7" fill="#fff"/>
    </svg>

    <div class="score" id="score">--</div>
    <div class="rating" id="rating">LOADING...</div>
  </div>

  <script>
    // ── 5단계 구간 정의 (수치 범위 / 명칭 / 색상) ─────────────
    const SEGMENTS = [
      { min: 0,  max: 25,  label: 'EXTREME FEAR',  color: '#e02f2f' }, // 진한 빨강
      { min: 25, max: 45,  label: 'FEAR',           color: '#ff6d2e' }, // 주황/빨강
      { min: 45, max: 55,  label: 'NEUTRAL',        color: '#ffb300' }, // 노랑/주황
      { min: 55, max: 75,  label: 'GREED',          color: '#66bb6a' }, // 연한 초록
      { min: 75, max: 100, label: 'EXTREME GREED',  color: '#00b34a' }  // 진한 초록
    ];

    const CX = 110, CY = 110, R = 88;
    const GAP_DEG = 2; // 세그먼트 사이 간격

    // score(0~100) → 반원 위 좌표 (0점=왼쪽 180°, 100점=오른쪽 0°)
    function point(score) {
      const angle = (180 - score * 1.8) * Math.PI / 180;
      return [CX + R * Math.cos(angle), CY - R * Math.sin(angle)];
    }

    // 세그먼트 호(arc) 생성
    const segGroup = document.getElementById('segments');
    SEGMENTS.forEach((seg, i) => {
      const gapScore = GAP_DEG / 1.8;
      const s = seg.min + (i === 0 ? 0 : gapScore / 2);
      const e = seg.max - (i === SEGMENTS.length - 1 ? 0 : gapScore / 2);
      const [x1, y1] = point(s);
      const [x2, y2] = point(e);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}`);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', seg.color);
      path.setAttribute('stroke-width', '15');
      path.setAttribute('stroke-linecap', 'round');
      path.classList.add('seg');
      path.dataset.index = i;
      segGroup.appendChild(path);
    });

    // ── 렌더링: 숫자·라벨·바늘·게이지 강조를 한 번에 ─────────
    function render(score, ratingText) {
      score = Math.max(0, Math.min(100, Math.round(score)));
      const seg = SEGMENTS.find(s => score < s.max) || SEGMENTS[SEGMENTS.length - 1];

      // 해당 구간만 강조
      document.querySelectorAll('.seg').forEach(p => {
        const active = SEGMENTS[p.dataset.index] === seg;
        p.classList.toggle('active', active);
        p.setAttribute('stroke-width', active ? '19' : '15');
      });

      // 바늘 회전 (0점 = -90°, 100점 = +90°)
      document.getElementById('needleGroup').style.transform =
        `rotate(${(score / 100) * 180 - 90}deg)`;

      // 글자색을 게이지 구간 색과 일치
      const scoreEl = document.getElementById('score');
      const ratingEl = document.getElementById('rating');
      scoreEl.innerText = score;
      scoreEl.style.color = seg.color;
      ratingEl.innerText = (ratingText || seg.label).toUpperCase();
      ratingEl.style.color = seg.color;
    }

    // ── 데이터 로딩 (기존 fetch 체인 유지) ────────────────────
    fetch('https://api.statmuse.com/fgi')
      .then(res => { if (!res.ok) throw new Error('API Error'); return res.json(); })
      .then(data => {
        const score = data.score ?? data.fgi?.score ?? data.value;
        const rating = data.rating || data.fgi?.rating || data.value_classification;
        render(score, rating);
      })
      .catch(() => {
        fetch('https://valeriansaliou.github.io/cnn-fear-greed-rss/feed.json')
          .then(r => r.json())
          .then(d => {
            const score = d.items ? Number(d.items[0].title.match(/\d+/)[0]) : NaN;
            if (isNaN(score)) throw new Error('parse fail');
            render(score); // rating은 구간 정의에서 자동 결정
          })
          .catch(() => {
            document.getElementById('rating').innerText = 'ERROR';
            document.getElementById('rating').style.color = '#777';
          });
      });
  </script>
</body>
</html>
